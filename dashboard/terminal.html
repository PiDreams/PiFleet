<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RemotePi Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .terminal-wrap { padding: 20px; }
    #terminal { height: 70vh; width: 100%; border-radius: 12px; overflow: hidden; }
    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    select, button, input {
      background: #111830; color: #e8ecff; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 10px 12px;
    }
  </style>
</head>
<body>
  <main class="terminal-wrap">
    <div class="toolbar">
      <select id="deviceSelect">
        <option value="local">Local</option>
      </select>
      <button id="connectBtn">Connect</button>
      <button id="disconnectBtn">Disconnect</button>
    </div>
    <div id="terminal"></div>
  </main>

  <script type="module" src="/terminal.js"></script>
</body>
</html>
